[package]
name = "quickdeck"
version = "0.1.0"
description = "QuickDeck desktop application"
authors = ["Yoshinao Inoguchi <yoshinao@inoguchi.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "quickdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
# Serializes the tests that share process-global state — the backup-store
# singleton (`static STORE` in backup_store.rs) and the process-global env vars
# some paths tests mutate. `cargo test` runs tests in parallel threads within one
# process, so those tests would otherwise race; `#[serial(...)]` with a shared key
# makes each such group mutually exclusive while unrelated tests still parallelize.
# Default features (async runtime + logging) are unused here; only the synchronous
# `#[serial]` attribute is needed.
serial_test = { version = "3.5.0", default-features = false }
tempfile = "3.27.0"
