[package]
name = "quickdeck"
version = "0.1.0"
description = "QuickDeck desktop application"
authors = ["Yoshinao Inoguchi <yoshinao@inoguchi.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

# Warnings are errors, on EVERY platform the app ships to — the gate this table exists for.
# It lives in the manifest rather than in CI or a RUSTFLAGS export so that one declaration
# covers `cargo check`, `cargo test`, `cargo build`, the local `npm run check`, and CI alike;
# a gate only CI enforces is one every developer meets late, and a `cfg(windows)` warning is
# invisible to a macOS-only gate because that code is never compiled there.
[lints.rust]
warnings = "deny"
# The one exception, and it must be explicit or the gate fails every Windows build forever:
# the MSVC linker prints an informational note (localized — in Japanese on a ja_JP machine)
# saying it created an import library. That is the toolchain narrating, not a defect in this
# code, and nothing here can silence it at the source.
linker_messages = "allow"

[lib]
name = "quickdeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
# Serializes the tests that share process-global state — the backup-store
# singleton (`static STORE` in backup_store.rs) and the process-global env vars
# some paths tests mutate. `cargo test` runs tests in parallel threads within one
# process, so those tests would otherwise race; `#[serial(...)]` with a shared key
# makes each such group mutually exclusive while unrelated tests still parallelize.
# Default features (async runtime + logging) are unused here; only the synchronous
# `#[serial]` attribute is needed.
serial_test = { version = "3.5.0", default-features = false }
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
