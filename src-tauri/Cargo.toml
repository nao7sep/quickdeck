[package]
name = "quickdeck"
version = "0.1.0"
description = "QuickDeck desktop application"
authors = ["Yoshinao Inoguchi <nao7sep@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "quickdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
