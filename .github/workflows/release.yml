name: Release

# Per the app-release-conventions: test gate -> per-OS package -> attach to a
# DRAFT release. CI stays minimal — the .dmg / setup.exe / portable-zip packaging
# lives in scripts/package.sh (macOS) and scripts/package.ps1 (Windows), which run
# `tauri build`. Nothing is published automatically; a draft is created for the
# pushed tag, verified, then published by hand (gh release edit --draft=false).
#
# Windows can't be cross-compiled from a Mac, so both platforms build in CI.
#
#   - push a tag `v*` -> build both platforms, attach installers + portables to a
#     single draft release for that tag.
#   - manual dispatch -> build only (no release), for a smoke check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: the frontend test suite (which includes the version-consistency check
  # across the manifests). Platform-independent, so it runs once and both build
  # jobs depend on it — a failure blocks the release before anything is built.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false # a Windows failure never cancels the macOS build
      matrix:
        include:
          - os: macos-latest
            package: bash scripts/package.sh
          - os: windows-latest
            package: pwsh scripts/package.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      # One command per OS — runs `tauri build` and emits the installer + portable
      # into dist/.
      - name: Package (host OS)
        run: ${{ matrix.package }}

      - name: Attach to draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          prerelease: true # 0.x is pre-release
          files: |
            artifacts/*.dmg
            artifacts/*-setup.exe
            artifacts/*-mac.zip
            artifacts/*-win.zip
