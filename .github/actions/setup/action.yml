name: Set up QuickDeck build
description: Node, the Rust toolchain and its cache, the npm package.json pins, and the project's npm dependencies. Both release jobs run it after checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
    # The npm the project pins in package.json's packageManager.
    - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      shell: bash
    - run: npm ci
      shell: bash
